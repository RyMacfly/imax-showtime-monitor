<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IMAX Monitor</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Microgramma", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }



        body {
            margin: 0;
            background: #0f1115;
            color: #f1f3f5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }


        .muted {
            color: #9aa1ac;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .card {
            background: #181b21;
            border: 1px solid #292e37;
            border-radius: 12px;
            padding: 16px;
        }

        .value {
            font-size: 20px;
            font-weight: 700;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        button {
            border: 1px solid #343a46;
            background: #20242c;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
        }

        button:hover {
            background: #2a303a;
        }

        button.primary {
            background: #3b82f6;
            border-color: #3b82f6;
        }

        button.danger {
            background: #9f3030;
            border-color: #9f3030;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 12px;
        }

        .movie {
            background: #181b21;
            border: 1px solid #292e37;
            border-radius: 12px;
            padding: 16px;
        }

        .movie.selected {
            border-color: #3b82f6;
        }

        .movie-top {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .movie-name {
            flex: 1;
            font-weight: 700;
            line-height: 1.3;
        }

        .toggle {
            width: 22px;
            height: 22px;
            accent-color: #3b82f6;
        }

        .dates {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .date {
            background: #252a33;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 12px;
        }

        .no-showtimes {
            margin-top: 12px;
            color: #8d949f;
            font-size: 13px;
        }

        .error {
            color: #ff8585;
            margin-top: 8px;
        }

        #updated {
            font-size: 12px;
            color: #777f8c;
        }

        #saveBar {
            display: none;
            align-items: center;
            gap: 10px;
            margin: 16px 0;
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(34, 197, 94, 0.10);
            border: 1px solid rgba(34, 197, 94, 0.35);
        }

        .save-button {
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .save-button:hover {
            background: #16a34a;
        }

        .discard-button {
            background: transparent;
            color: #aaa;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            cursor: pointer;
        }

        .discard-button:hover {
            color: rgb(252, 2, 2);
            border-color: #ff0000;
        }

        #unsavedText {
            color: #86efac;
            font-size: 13px;
        }

        .imax-banner {
            width: 100%;
            height: 180px;

            background: linear-gradient(135deg,
                    #0057b8 0%,
                    #0074d9 50%,
                    #003f88 100%);

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            overflow: hidden;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.35);
        }

        .imax-banner::before {
            content: "";
            position: absolute;
            inset: 0;

            background:
                linear-gradient(120deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.08) 45%,
                    transparent 55%);

            pointer-events: none;
        }

        .imax-banner-content {
            position: relative;
            z-index: 1;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 4px;
        }

        .imax-logo {
            width: 300px;
            max-width: none;
            height: auto;

            transform: scale(1.25);

            object-fit: contain;

            filter:
                drop-shadow(0 4px 8px rgba(0, 0, 0, 0.35));
        }

        .imax-title {
            color: white;

            font-family:
                Impact,
                "Arial Black",
                sans-serif;

            font-size: 24px;
            font-weight: 900;

            letter-spacing: 0.2em;

            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="imax-banner">
            <div class="imax-banner-content">
                <img src="/images/imax-logo-transparent.png" alt="IMAX" class="imax-logo">
                <div class="imax-title">

                </div>
            </div>
        </div>
        <header>

            <div>
                <h1 class="site-title">IMAX Monitor</h1>
                <div class="muted">Regal Edwards Boise IMAX</div>
            </div>
            <div id="updated">Loading...</div>
        </header>

        <div class="status-grid">
            <div class="card">
                <div class="muted">Status</div>
                <div class="value" id="status">—</div>
            </div>
            <div class="card">
                <div class="muted">Mode</div>
                <div class="value" id="mode">—</div>
            </div>
            <div class="card">
                <div class="muted">Monitoring</div>
                <div class="value" id="count">—</div>
            </div>
            <div class="card">
                <div class="muted">Last Check</div>
                <div class="value" id="last-check">—</div>
            </div>
            <div class="card">
                <div class="muted">Next Check</div>
                <div class="value" id="next-check">—</div>
            </div>
        </div>

        <div class="controls">
            <button class="primary" onclick="setAll()">Monitor All</button>
            <button onclick="clearAll()">Deselect All</button>
            <button onclick="checkNow()">Check Now</button>
            <button onclick="refresh()">Refresh</button>
        </div>

        <div id="saveBar" style="display: none;">
            <button id="saveChangesButton" class="save-button" onclick="saveChanges()">
                Save Changes
            </button>

            <button id="discardChangesButton" class="discard-button" onclick="discardChanges()"
                onhover="this.style.backgroundColor='rgba(255, 0, 0, 0.1)';"
                onmouseout="this.style.backgroundColor='transparent';">
                Cancel
            </button>

            <span id="unsavedText">
                Unsaved changes
            </span>
        </div>

        <div id="error" class="error"></div>
        <div id="movies" class="movie-grid"></div>
    </div>

    <script>

        let statusData = {};

        // ============================================================
        // UI STATE
        // ============================================================

        // What the server says is currently saved.
        let savedMovies = new Set();

        // What the user is currently selecting in the UI.
        // This is NOT written to the server until Save Changes.
        let pendingMovies = null;

        // Saved mode: "all" or "selected"
        let savedMode = "selected";

        // Temporary mode while editing.
        let pendingMode = null;


        // ============================================================
        // HELPERS
        // ============================================================

        function esc(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;");
        }


        function formatTime(value) {

            if (!value) {
                return "—";
            }

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleString();
        }


        async function api(path, options = {}) {

            const response = await fetch(path, {
                ...options,

                headers: {
                    "Content-Type": "application/json",
                    ...(options.headers || {})
                }
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || "Request failed"
                );
            }

            return data;
        }


        // ============================================================
        // CURRENT UI SELECTION
        // ============================================================

        function getCurrentSelection() {

            if (pendingMovies !== null) {
                return new Set(pendingMovies);
            }

            return new Set(savedMovies);
        }


        // ============================================================
        // CHECK IF CHANGES EXIST
        // ============================================================

        function hasSelectionChanged() {

            if (pendingMovies === null) {
                return false;
            }

            const pending = new Set(
                pendingMovies
            );

            if (pending.size !== savedMovies.size) {
                return true;
            }

            for (const movie of pending) {

                if (!savedMovies.has(movie)) {
                    return true;
                }
            }

            return false;
        }


        // ============================================================
        // SAVE BAR
        // ============================================================

        function updateSaveBar() {

            const saveBar =
                document.getElementById("saveBar");

            if (!saveBar) {
                return;
            }

            if (hasSelectionChanged()) {

                saveBar.style.display = "flex";

            } else {

                saveBar.style.display = "none";
            }
        }


        // ============================================================
        // REFRESH STATUS
        // ============================================================

        async function refresh() {

            try {

                const newStatus =
                    await api("/api/status");

                statusData = newStatus;

                // ----------------------------------------------------
                // IMPORTANT:
                //
                // The server can refresh every 5 seconds.
                //
                // DO NOT overwrite pendingMovies here.
                // ----------------------------------------------------

                if (pendingMovies === null) {

                    savedMovies = new Set(
                        statusData.saved_movies
                        ||
                        statusData.selected_movies
                        ||
                        []
                    );

                    savedMode =
                        statusData.saved_mode
                        ||
                        statusData.mode
                        ||
                        "selected";
                }

                // ----------------------------------------------------
                // STATUS DISPLAY
                // ----------------------------------------------------

                document.getElementById(
                    "status"
                ).textContent =
                    statusData.running
                        ? "Running"
                        : "Stopped";

                document.getElementById(
                    "mode"
                ).textContent =
                    pendingMode === "selected"
                        ? "Selected"
                        : (
                            savedMode === "all"
                                ? "All Movies"
                                : "Selected"
                        );

                const currentSelection =
                    getCurrentSelection();

                document.getElementById(
                    "count"
                ).textContent =
                    `${currentSelection.size} movie(s)`;

                document.getElementById(
                    "last-check"
                ).textContent =
                    formatTime(
                        statusData.last_check
                    );

                document.getElementById(
                    "next-check"
                ).textContent =
                    formatTime(
                        statusData.next_check
                    );

                document.getElementById(
                    "updated"
                ).textContent =
                    `Updated ${formatTime(
                        statusData.last_update
                    )
                    }`;

                document.getElementById(
                    "error"
                ).textContent =
                    statusData.error_message || "";

                renderMovies();

                updateSaveBar();

            } catch (error) {

                document.getElementById(
                    "error"
                ).textContent =
                    error.message;
            }
        }


        // ============================================================
        // RENDER MOVIES
        // ============================================================

        function renderMovies() {

            const movies =
                statusData.available_movies || [];

            const selected =
                getCurrentSelection();

            const showtimes =
                statusData.showtimes || {};

            const html = movies.map(movie => {

                const isSelected =
                    selected.has(movie);

                const dates = isSelected
                    ? (showtimes[movie] || []).filter(
                        item =>
                            item.available === true
                    )
                    : [];

                return `
            <div class="movie ${isSelected ? "selected" : ""}">

            <div class="movie-top">

                <input
                    class="toggle"
                    type="checkbox"
                    data-movie="${esc(movie)}"
                    ${isSelected ? "checked" : ""}
                >

                <div class="movie-name">
                    ${esc(movie)}
                </div>

            </div>

            ${!isSelected
                        ? `
                    <div class="no-showtimes">
                        Not monitoring
                    </div>
            `
                        : dates.length
                            ? `
                <div class="dates">
                    ${dates.map(item =>
                                `
                            <span class="date">
                                ${esc(item.day)}
                                ${esc(item.date)}
                            </span>
                            `
                            ).join("")
                            }
                </div>
                `
                            : `
                <div class="no-showtimes">
                    No available showtimes
                </div>
                `
                    }

                </div>
                        `;

            }).join("");

            document.getElementById(
                "movies"
            ).innerHTML =
                html ||
                `<div class="muted">
                No movies found yet.
                </div>`;
        }

        // ============================================================
        // CHECKBOX DELEGATION
        //
        // #movies is rebuilt via innerHTML on every render, so we
        // attach one listener to the parent instead of one per
        // checkbox. This also avoids embedding movie titles directly
        // inside inline onchange="" attributes, which breaks when a
        // title contains a double quote.
        // ============================================================

        document.getElementById("movies").addEventListener("change", (event) => {

            const checkbox = event.target;

            if (!checkbox.classList.contains("toggle")) {
                return;
            }

            toggleMovie(
                checkbox.dataset.movie,
                checkbox.checked
            );
        });


        // ============================================================
        // CHECKBOX CHANGE
        // ============================================================

        function toggleMovie(movie, checked) {

            // Start with the currently displayed selection.
            if (pendingMovies === null) {

                pendingMovies =
                    new Set(savedMovies);
            }

            if (checked) {

                pendingMovies.add(movie);

            } else {

                pendingMovies.delete(movie);
            }

            // Once the user manually changes a checkbox,
            // we're in selected/manual mode.
            pendingMode = "selected";

            renderMovies();
            updateSaveBar();

            const currentSelection =
                getCurrentSelection();

            document.getElementById(
                "count"
            ).textContent =
                `${currentSelection.size} movie(s)`;
        }


        // ============================================================
        // SAVE CHANGES
        // ============================================================

        async function saveChanges() {

            if (pendingMovies === null) {
                return;
            }

            const movies =
                [...pendingMovies];

            try {

                await api(
                    "/api/config",
                    {
                        method: "POST",

                        body: JSON.stringify({
                            mode: "selected",
                            movies: movies
                        })
                    }
                );

                // The saved state now becomes
                // the pending state.
                savedMovies =
                    new Set(movies);

                savedMode =
                    "selected";

                pendingMovies = null;
                pendingMode = null;

                updateSaveBar();

                renderMovies();

                document.getElementById(
                    "mode"
                ).textContent =
                    "Selected";

                document.getElementById(
                    "count"
                ).textContent =
                    `${savedMovies.size} movie(s)`;

                // Tell the monitor to immediately
                // perform a new check.
                await api(
                    "/api/check-now",
                    {
                        method: "POST"
                    }
                );

                // Get the new monitor status.
                await refresh();

            } catch (error) {

                alert(
                    "Could not save changes:\n\n"
                    + error.message
                );
            }
        }


        // ============================================================
        // DISCARD CHANGES
        // ============================================================

        function discardChanges() {

            pendingMovies = null;
            pendingMode = null;

            renderMovies();
            updateSaveBar();

            document.getElementById(
                "mode"
            ).textContent =
                savedMode === "all"
                    ? "All Movies"
                    : "Selected";

            document.getElementById(
                "count"
            ).textContent =
                `${savedMovies.size} movie(s)`;
        }


        // ============================================================
        // MONITOR ALL
        // ============================================================

        async function setAll() {

            try {

                await api(
                    "/api/config",
                    {
                        method: "POST",

                        body: JSON.stringify({
                            mode: "all",
                            movies: []
                        })
                    }
                );

                // Monitor All is an immediate saved action.
                pendingMovies = null;
                pendingMode = null;

                savedMode = "all";

                await api(
                    "/api/check-now",
                    {
                        method: "POST"
                    }
                );

                await refresh();

            } catch (error) {

                alert(
                    error.message
                );
            }
        }


        // ============================================================
        // DESELECT ALL
        // ============================================================

        function clearAll() {

            // Do NOT save immediately.
            //
            // This creates an editable pending state.
            pendingMovies = new Set();

            pendingMode = "selected";

            renderMovies();
            updateSaveBar();

            document.getElementById(
                "mode"
            ).textContent =
                "Selected";

            document.getElementById(
                "count"
            ).textContent =
                "0 movie(s)";
        }


        // ============================================================
        // CHECK NOW
        // ============================================================

        async function checkNow() {

            try {

                await api(
                    "/api/check-now",
                    {
                        method: "POST"
                    }
                );

                await refresh();

            } catch (error) {

                alert(
                    error.message
                );
            }
        }


        // ============================================================
        // INITIAL LOAD
        // ============================================================

        refresh();


        // ============================================================
        // AUTOMATIC STATUS REFRESH
        // ============================================================

        setInterval(
            refresh,
            5000
        );


    </script>
</body>

</html>
